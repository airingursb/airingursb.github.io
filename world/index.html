  (function () {
    const loader = document.getElementById('world-loader')

    const HAS_WEBGL = (

      'WebGLRenderingContext' in window

      loader.remove()
      if (fallback) fallback.hidden = false
      return
    }

    const start = Date.now()
    const FADE_MIN_MS = 600

    function isCanvasWorking(canvas) {
      if (!canvas) return false
      try {
        const ctx = canvas.getContext('webgl2') || canvas.getContext('webgl')
        return !!ctx && !ctx.isContextLost?.()
      } catch { return false }
    }

    function fade() {
      const dt = Date.now() - start
      const wait = Math.max(0, FADE_MIN_MS - dt)

        // race-window flash on slow CPUs where DOM removal fires
        // before the opacity animation has fully committed.

      if (loader.isConnected) loader.remove()
      if (fallback) fallback.hidden = false
    }

    const obs = new MutationObserver(() => {
      const c = document.querySelector('#world-root canvas')
      if (c && isCanvasWorking(c)) {
        requestAnimationFrame(() => requestAnimationFrame(fade))
        obs.disconnect()
      }
    })
    obs.observe(document.body, { childList: true, subtree: true })

    // V40: extended 12s patience + escalate to fallback if canvas not
    // working (was: silently fade splash even on failure → user saw black).
    //
    // V2-final fix (2026-05-25): only show fallback if the splash
    // loader is still up. If it already faded, the canvas already
    // worked at least once — a transient context loss at the 12s
    // mark (e.g., Chrome flushed GPU memory briefly) must NOT pop
    // the fallback over an already-working scene.
    setTimeout(() => {
      const c = document.querySelector('#world-root canvas')
      if (c && isCanvasWorking(c)) {
        if (loader.isConnected) fade()
      } else if (loader.isConnected) {
        obs.disconnect()
        showFallback()
      }
      // else: loader already faded → canvas worked → leave scene alone
    }, 12000)
  })()

270697],&quot;text&quot;:[0,&quot;Opus５でもBlenderMCPのお城作りためしてもらったなんだけど、Fableと比べてもレベル違いすぎて笑ったんｗｗｗｗなんで同バージョンの最上位モデルより強いのだｗｗｗ  \n\n!\n\n!\n\n!\n\n!&quot;],&quot;title&quot;:[0,&quot;Tweets From しとちゃ！&quot;],&quot;author&quot;:[0,&quot;@nemumusitocha on Twitter&quot;],&quot;date&quot;:[0,&quot;&quot;],&quot;url&quot;:[0,&quot;https://x.com/nemumusitocha/status/2080794529142341815&quot;]}],[0,{&quot;id&quot;:[0,1037270696],&quot;text&quot;:[0,&quot;Anthropic 最近在 Claude Code 博客分享了一套很值得实践的方法：用 Skills 把人工检查变成自动验证循环。\n\n平时的流程通常是 Claude Code 写完代码，你来检查，发现问题后再让它修改。任务虽然交给了 AI，验收环节依然离不开人，最后的瓶颈还是你。\n\n验证循环把这一步也交给系统：\n\nClaude Code \n\n!&quot;],&quot;title&quot;:[0,&quot;Tweets From Xudong Han&quot;],&quot;author&quot;:[0,&quot;@Xudong07452910 on Twitter&quot;],&quot;date&quot;:[0,&quot;&quot;],&quot;url&quot;:[0,&quot;https://x.com/Xudong07452910/status/2080509780213264819&quot;]}],[0,{&quot;id&quot;:[0,1037262860],&quot;text&quot;:[0,&quot;We removed ~80% of the Claude Code system prompt for our newest models, this is what we&#39;ve learned about writing system prompts, skills and Claude.MDs for them.&quot;],&quot;title&quot;:[0,&quot;Tweets From Thariq&quot;],&quot;author&quot;:[0,&quot;@trq212 on Twitter&quot;],&quot;date&quot;:[0,&quot;&quot;],&quot;url&quot;:[0,&quot;https://x.com/trq212/status/2080710971228918066&quot;]}],[0,{&quot;id&quot;:[0,1037262859],&quot;text&quot;:[0,&quot;Opus 5, snowboarder test, one shot. On par with Fable, ahead of every other model I&#39;ve run. No visual defects on the first pass, and the sliding physics feel right.&quot;],&quot;title&quot;:[0,&quot;Tweets From Alex Ermolov&quot;],&quot;author&quot;:[0,&quot;@alex_erm on Twitter&quot;],&quot;date&quot;:[0,&quot;&quot;],&quot;url&quot;:[0,&quot;https://x.com/alex_erm/status/2080739261909762364&quot;]}],[0,{&quot;id&quot;:[0,1037231864],&quot;text&quot;:[0,&quot;最近朋友推荐一个非常适合学习 Agent Harness Engineering 的工具：claude-tap。\n\n它像是 Claude Code、Codex 等 Coding Agent 的本地可观测性平台，可以看到一次真实 Agent 运行中的：\n\nSystem     (function() {
      var switcher = document.getElementById('themeSwitcher');
      var modeToggle = document.getElementById('modeToggle');

      // Mode toggle (light/dark)
      function updateModeIcon() {
        var isLight = document.documentElement.getAttribute('data-mode') === 'light';
        switcher.classList.toggle('light-mode', isLight);
      }
      modeToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        var current = document.documentElement.getAttribute('data-mode');
        var next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mode', next);
        localStorage.setItem('blog-mode', next);
        localStorage.setItem('blog-mode-set', '1');
        updateModeIcon();
        if (typeof umami !== 'undefined') {
          umami.track('dark-mode-toggle', { mode: next });
          umami.identify({ theme: next });
        }
      });
      updateModeIcon();
    })();
  </script> <!-- Mobile masthead dropdown: inject hamburger + wire toggle on any page with .mast-bar --> <script>
    (function () {
      var bar = document.querySelector('.mast-bar');
      var links = document.querySelector('.mast-bar .mast-links');
      if (!bar || !links) return;
      // If a page already has its own mast-toggle, don't inject a duplicate
      if (bar.querySelector('.mast-toggle')) return;

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mast-toggle';
      btn.setAttribute('aria-label', 'Open menu');
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12 M2 8h12 M2 12h12"/></svg>';
      bar.insertBefore(btn, links);

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = links.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', function (e) {
        if (!links.contains(e.target) && !btn.contains(e.target)) {
          links.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && links.classList.contains('open')) {
          links.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script> </body> </html>
