<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panda circular pointer motion</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        color: #252320;
        background: radial-gradient(circle at 20% 10%, #fff 0, #f7f2e9 42%, #ece2d2 100%);
        font: 16px/1.6 system-ui, sans-serif;
      }
      main { max-width: 720px; padding: 72px 40px; }
      h1 { margin: 0 0 12px; font-size: clamp(30px, 6vw, 64px); line-height: 1.05; }
      p { max-width: 560px; color: #6a6258; }
      #panda {
        position: fixed;
        right: 20px;
        bottom: 12px;
        filter: drop-shadow(0 12px 18px rgb(73 58 35 / 14%));
        contain: layout paint style;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>把鼠标绕着熊猫移动</h1>
      <p>同一张 circular atlas 通过 atan2 映射方向，并沿最短环形距离平滑追踪。鼠标经过左上与左侧之间时不再切换独立视频。</p>
    </main>
    <div id="panda" role="img" aria-label="跟随鼠标视线的卡通熊猫"></div>
    <script type="module">
      import { mountPandaMotion } from "./panda-motion.js";
      mountPandaMotion(document.querySelector("#panda"));
    </script>
  </body>
</html>
