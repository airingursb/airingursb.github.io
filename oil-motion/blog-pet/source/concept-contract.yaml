# SHU-818 Blog Pet — Concept Contract (oil-motion fact source #1)
# Locked product decisions. Do not silently expand.

subject_count: 1
subjects:
  - identity: >
      Round ink-wash panda "Airing" matching comics-studio/refs/panda.png —
      black eye patches, round black ears, soft brush fur, gentle expression.
style: >
      Black-and-white 水墨 / ink wash, organic brushstroke, minimalist,
      soft pale accents only if needed, no saturated color, no paper plate in final asset.
motion_intent: >
      V1 Pilot: head/gaze turns to follow pointer azimuth (look left ↔ front ↔ look right).
      Idle rest faces camera. Continuous, damped, no flicker on fast reverse.
background_owner: page
scene: null
driver: pointer
input_semantics: continuous
time_control: scrub
navigation: none
clip_continuity: chain
continuity:
  - same panda identity / proportions / markings
  - transparent page background (no baked desk/paper)
  - bust framing and vertical anchor stable across keyframes
destination: >
      Article pages (/posts/*), fixed bottom-left, ~120–160 CSS px display,
      desktop-first; hide or static on narrow viewports; theme switcher owns bottom-right.
reduced_motion: static K0 idle frame only
dismissible: localStorage key blog-pet-dismissed=1
