# Derived from source/concept-contract.yaml — production plan only

concept_contract: source/concept-contract.yaml
identity_bible: source/identity-bible.md
parameter_space: linear
media_access: random
gesture_policy:
  unit: continuous
  inertia: coalesce
  while_active: retarget
  boundary: clamp
  programmatic_navigation: ignore
storyboard: |
  Rest facing camera (K0). Pointer left of pet → look left (K1).
  Pointer right of pet → look right (K2). Smooth damp between frames.
keyframes:
  - id: K0
    file: pilot/keyframes/K0-idle-front.png
    meaning: idle front, rest / reduced-motion fallback
  - id: K1
    file: pilot/keyframes/K1-look-left.png
    meaning: head/gaze toward viewer-left
  - id: K2
    file: pilot/keyframes/K2-look-right.png
    meaning: head/gaze toward viewer-right
clip_chain:
  - pilot: K0 → K1 (short morph video for oil-motion pilot gate)
  - atlas: K1 | K0 | K2 horizontal strip for pointer scrub
rest_state: K0
loop: none
anchor: bottom
frame_policy: native
target_fps: 12
quality_target: >
  Display ~144 CSS px @2x → source cells 256×256. Atlas 768×256.
  Pilot video is evidence only; runtime uses alpha atlas (3 frames).
delivery_selected: alpha-atlas
runtime_controller: frame-scrub
reduced_motion: K0 static PNG
